import java.util.Properties

plugins {
    id 'com.android.application' version '9.3.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def localSecrets = new Properties()
def localSecretsFile = rootProject.file('local.properties')
if (localSecretsFile.exists()) {
    localSecretsFile.withInputStream { localSecrets.load(it) }
}
def asJavaString = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace 'kr.carecabin.demo'
    compileSdk 36

    defaultConfig {
        applicationId 'kr.carecabin.demo'
        minSdk 28
        targetSdk 34
        versionCode 3
        versionName '0.3'

        buildConfigField 'String', 'ITS_API_KEY', asJavaString(localSecrets.getProperty('ITS_API_KEY', ''))
        buildConfigField 'String', 'AIRKOREA_API_KEY', asJavaString(localSecrets.getProperty('AIRKOREA_API_KEY', ''))
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Pleos Vehicle SDK
dependencies {
    implementation 'ai.pleos.playground:Vehicle:2.3.2'
    implementation 'ai.pleos.playground:FusedLocation:1.1.3'
}
